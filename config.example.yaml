# EternalShell example config.
#
# Copy to /etc/eternalshell/config.yaml (or ./config.yaml for local tests) and
# restrict it: chmod 600 /etc/eternalshell/config.yaml
#
# The TUI (`eternalshell`) works without a config. `eternalshell watch` and
# `eternalshell test-mail` need one, including the smtp section.

server:
  name: main-vps          # shown in mails; defaults to the host name

alerts:
  cpu:
    # `watch` samples every 10 s. An alert needs the AVERAGE over the whole
    # duration to reach the percentage, so a short spike never fires. Use a
    # duration of at least 10s. One mail per incident, one all-clear mail when
    # the average of the last minute is below the threshold again.
    process: { percent: 80, duration: 15m }   # one process, 100 = one full core
    total:   { percent: 90, duration: 10m }   # the whole server, 100 = all cores
  # `watch` checks every real mounted filesystem once a minute. One mail when a
  # mount is at least this full, one all-clear when it is 2 points below.
  disk: { percent: 90 }

smtp:
  host: smtp.example.com
  port: 587               # 465 = implicit TLS, any other port = STARTTLS (required)
  username: alert@example.com
  # The password is NEVER written here. Name the environment variable instead,
  # and export it (or set it as a systemd credential) before running:
  #   export ETERNALSHELL_SMTP_PASSWORD='...'
  password_env: ETERNALSHELL_SMTP_PASSWORD
  # from: alert@example.com   # optional, defaults to username
  to: [philip@example.com]
